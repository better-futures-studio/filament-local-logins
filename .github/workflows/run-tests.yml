name: run-tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            php: 8.1
            laravel: 10.*
            filament: 3.*
            testbench: 8.*
            phpunit: 10.5.*
            stability: prefer-lowest
          - os: ubuntu-latest
            php: 8.2
            laravel: 11.*
            filament: 3.*
            testbench: 9.*
            phpunit: 11.5.*
            stability: prefer-stable
          - os: ubuntu-latest
            php: 8.2
            laravel: 12.*
            filament: 3.*
            testbench: 10.*
            phpunit: 11.5.*
            stability: prefer-stable
          - os: ubuntu-latest
            php: 8.2
            laravel: 11.*
            filament: 4.*
            testbench: 9.*
            phpunit: 11.5.*
            stability: prefer-lowest
          - os: ubuntu-latest
            php: 8.3
            laravel: 12.*
            filament: 4.*
            testbench: 10.*
            phpunit: 12.5.*
            stability: prefer-stable
          - os: ubuntu-latest
            php: 8.2
            laravel: 11.*
            filament: 5.*
            testbench: 9.*
            phpunit: 11.5.*
            stability: prefer-lowest
          - os: ubuntu-latest
            php: 8.3
            laravel: 12.*
            filament: 5.*
            testbench: 10.*
            phpunit: 12.5.*
            stability: prefer-stable
          - os: ubuntu-latest
            php: 8.3
            laravel: 13.*
            filament: 5.*
            testbench: 11.*
            phpunit: 12.5.*
            stability: prefer-stable
          - os: windows-latest
            php: 8.5
            laravel: 13.*
            filament: 5.*
            testbench: 11.*
            phpunit: 13.*
            stability: prefer-stable

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Filament ${{ matrix.filament }} / ${{ matrix.stability }} / ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite, pdo_sqlite, curl, dom, zip, json, intl, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show --direct

      - name: Execute tests
        run: vendor/bin/phpunit
